[project]
name = "viral-radar"
version = "0.1.0"
description = "全网多平台爆款对标分析与脚本生成系统（IR-0001）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "litellm>=1.57",
  "rapidocr-onnxruntime>=1.4,<2",
  "faster-whisper>=1.0,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viral_radar"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# 队列容错面：处理步骤失败类型未知，必须统一折叠（BUDGET-2 语义；不用行内抑制标记）
"src/viral_radar/app/queue.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests/pytest"]
addopts = "-q"