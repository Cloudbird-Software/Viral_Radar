version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
        cooldown-days: 7
  # Python 业务依赖（SC-3 依赖周更）——litellm/rapidocr-onnxruntime/faster-whisper
  # 等多模态重依赖此前无任何自动更新/漏洞检测覆盖（治理对齐补面，ADR-0091）
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        cooldown-days: 7
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        cooldown-days: 7
    ignore:
      # TS 7 与 typescript-eslint（peer <6.1.0）不兼容，npm ci 直接失败。
      # 工具链支持后删除此规则重新升级。见 PR #1。
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
